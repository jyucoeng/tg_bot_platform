# ============================================================
#  Telegram 多 Bot 托管平台 - Docker Compose 配置
#  镜像由 GitHub Actions 自动构建并推送到 ghcr.io (GitHub Package)
# ============================================================

# ---------- 公共服务配置（两个服务共用）----------
x-common-service-config: &common-service-config
  restart: unless-stopped
  volumes:
    - ./data:/app/data
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/bot_data.db') else 1)"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

# ---------- 公共环境变量（tg-bot-host 与 tg-verify-server 都需要）----------
x-common-environment: &common-environment
  MANAGER_TOKEN: "${MANAGER_TOKEN}"            # 管理机器人 API Token
  ADMIN_CHANNEL: "${ADMIN_CHANNEL}"            # 管理员频道/群组 ID（负数为频道id，正数为管理员tg id）
  GH_USERNAME: "${GH_USERNAME}"                # GitHub 用户名（备份用）
  GH_REPO: "${GH_REPO}"                        # GitHub 仓库名（备份用）
  GH_TOKEN: "${GH_TOKEN}"                      # GitHub Token（备份用）
  VERIFY_SERVER_URL: "${VERIFY_SERVER_URL}"    # 验证服务器公开域名，host 用它拼接验证链接

# ---------- verify 服务器专属环境变量 ----------
x-verify-server-environment: &verify-server-environment
  CF_TURNSTILE_SITE_KEY: "${CF_TURNSTILE_SITE_KEY}"        # CF Turnstile Site Key（可选）
  CF_TURNSTILE_SECRET_KEY: "${CF_TURNSTILE_SECRET_KEY}"    # CF Turnstile Secret Key（可选）

services:
  # ---------- 1. Bot 托管服务（默认运行 host）----------
  tg-bot-host:
    <<: *common-service-config
    image: ghcr.io/jyucoeng/tg_bot_platform:latest
    container_name: tg_multi_bot
    environment:
      <<: *common-environment
    # 未指定 command，使用镜像默认 CMD (host) -> 运行 host_bot.py
    # 无需暴露端口（bot 通过长轮询/出站请求工作）

  # ---------- 2. 验证服务器（command: verify -> 运行 verify_server.py）----------
  tg-verify-server:
    <<: *common-service-config
    image: ghcr.io/jyucoeng/tg_bot_platform:latest
    container_name: tg_verify_server
    command: ["verify"]
    environment:
      <<: *common-environment
      <<: *verify-server-environment
    ports:
      # 宿主端口 ${VERIFY_SERVER_PORT} 映射到容器 5000（verify 固定监听 5000）
      # 注意：不要在容器内注入 VERIFY_SERVER_PORT，否则应用会绑定到该端口导致对不上
      - "${VERIFY_SERVER_PORT}:5000"
