# ============================================================
#  Build and push Docker image → GitHub Container Registry (ghcr.io)
#  触发方式:
#    1) push 到 main          → 自动构建并推送 latest
#    2) 打 git tag v*.*.*     → 自动构建并推送 semver 版本号 (2.0.3 / 2.0 / 2)
#    3) 手动触发(workflow_dispatch) → 可在"版本号"输入框填自定义版本(如 2.0.3 或 v2.0.3)
#       不填版本号则推送 latest
# ============================================================

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 自定义镜像版本号,如 2.0.3 或 v2.0.3;留空则推送 latest(会自动转为小写)
        required: false
        default: ''

env:
  REGISTRY_GITHUB: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 归一化手动输入的版本号 -> 小写、去掉前导 v (GHCR 标签必须小写)
      - name: Resolve version tag
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            VERSION=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]' | sed -E 's/^v//')
            echo "version-tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "将使用自定义版本: $VERSION"
          else
            echo "version-tag=" >> "$GITHUB_OUTPUT"
            echo "未填写版本号,将使用默认 latest"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version-tag }},enable=${{ steps.version.outputs.version-tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"
